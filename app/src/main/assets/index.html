<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Explorer</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#182333;background:#f3f6fa}
body{margin:0}header{background:#163d63;color:white;padding:22px 18px}
h1{margin:0 0 6px;font-size:25px}header p{margin:0;opacity:.85}
main{padding:16px;max-width:850px;margin:auto}.panel{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 3px 14px #132b4410}
input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #cbd5e1}
input{width:100%;box-sizing:border-box;margin:8px 0}
button{background:#1769aa;color:white;border:0;margin:4px 4px 4px 0}
button.secondary{background:#e7eef5;color:#18344e}
a{color:#1267a8}small,.muted{color:#64748b}.result{padding:10px;border-bottom:1px solid #e5eaf0}
#map{width:100%;height:260px;border:0;border-radius:12px}
</style>
</head>
<body>
<header><h1>🌍 World Explorer</h1><p id="tagline">探索世界，从一个地名开始</p></header>
<main>
<section class="panel">
  <button class="secondary" onclick="setLang('zh')">中文</button>
  <button class="secondary" onclick="setLang('en')">English</button>
  <h2 id="searchTitle">搜索城市、国家或自然地理</h2>
  <input id="place" placeholder="例如：巴黎、瑞典、尼罗河">
  <button onclick="searchPlace()" id="searchBtn">搜索</button>
  <div id="matches"></div>
</section>
<section class="panel">
  <h2 id="overviewTitle">目的地介绍</h2>
  <div id="overview" class="muted">搜索一个地点以查看介绍。</div>
  <button class="secondary" onclick="speak()" id="speakBtn">🔊 朗读介绍</button>
</section>
<section class="panel">
  <h2 id="mapTitle">地图</h2>
  <div id="mapNote" class="muted">选择地点后显示地图。</div>
  <iframe id="map" loading="lazy" title="OpenStreetMap map"></iframe>
</section>
<section class="panel">
  <h2 id="nearbyTitle">周边探索</h2>
  <div id="nearbyLinks" class="muted">搜索地点后生成周边探索入口。</div>
</section>
<section class="panel">
  <h2 id="heritageTitle">世界遗产与视频</h2>
  <div id="heritageLinks">搜索地点后可查询相关资料。</div>
  <p class="muted">当前为基础原型；周边商家、遗产资料和视频通过外部公开页面查询，尚未接入实时预订或完整数据库。</p>
</section>
</main>
<script>
let lang='zh', currentName='', currentLat=null, currentLon=null, currentSummary='';
const words={
 zh:{tag:'探索世界，从一个地名开始',search:'搜索城市、国家或自然地理',placeholder:'例如：巴黎、瑞典、尼罗河',btn:'搜索',overview:'目的地介绍',empty:'搜索一个地点以查看介绍。',speak:'🔊 朗读介绍',map:'地图',mapNote:'选择地点后显示地图。',nearby:'周边探索',heritage:'世界遗产与视频',err:'暂时无法获取数据，请检查网络后重试。'},
 en:{tag:'Discover the world, one place at a time',search:'Search cities, countries or natural features',placeholder:'e.g. Paris, Sweden, Nile River',btn:'Search',overview:'Destination overview',empty:'Search for a place to see an introduction.',speak:'🔊 Read aloud',map:'Map',mapNote:'Choose a place to show the map.',nearby:'Explore nearby',heritage:'World heritage & videos',err:'Unable to load data. Check your connection and try again.'}
};
function setLang(l){
 lang=l;const w=words[l];document.documentElement.lang=l==='zh'?'zh-CN':'en';
 document.getElementById('tagline').textContent=w.tag;document.getElementById('searchTitle').textContent=w.search;
 document.getElementById('place').placeholder=w.placeholder;document.getElementById('searchBtn').textContent=w.btn;
 document.getElementById('overviewTitle').textContent=w.overview;document.getElementById('speakBtn').textContent=w.speak;
 document.getElementById('mapTitle').textContent=w.map;document.getElementById('nearbyTitle').textContent=w.nearby;
 document.getElementById('heritageTitle').textContent=w.heritage;
 if(!currentSummary)document.getElementById('overview').textContent=w.empty;
 if(currentName)loadSummary(currentName);
}
async function searchPlace(){
 const q=document.getElementById('place').value.trim();if(!q)return;
 const box=document.getElementById('matches');box.textContent='…';
 try{
  const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=8&language='+(lang==='zh'?'zh':'en')+'&format=json');
  const data=await r.json();box.innerHTML='';
  (data.results||[]).forEach(p=>{
   const d=document.createElement('div');d.className='result';
   const b=document.createElement('button');b.className='secondary';
   b.textContent=[p.name,p.admin1,p.country].filter(Boolean).join(', ');
   b.onclick=()=>selectPlace(p);d.appendChild(b);box.appendChild(d);
  });
  if(!data.results?.length)box.textContent=words[lang].err;
 }catch(e){box.textContent=words[lang].err;}
}
function selectPlace(p){
 currentName=p.name;currentLat=p.latitude;currentLon=p.longitude;
 document.getElementById('map').src='https://www.openstreetmap.org/export/embed.html?bbox='+(currentLon-.12)+'%2C'+(currentLat-.08)+'%2C'+(currentLon+.12)+'%2C'+(currentLat+.08)+'&layer=mapnik&marker='+currentLat+'%2C'+currentLon;
 document.getElementById('mapNote').textContent=[p.name,p.admin1,p.country].filter(Boolean).join(', ');
 const q=encodeURIComponent(currentName);
 document.getElementById('nearbyLinks').innerHTML=
  '<p><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/#map=14/'+currentLat+'/'+currentLon+'">OpenStreetMap · 地图与周边</a></p>'+
  '<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/hotels/@'+currentLat+','+currentLon+',14z">住宿搜索</a></p>'+
  '<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/restaurants/@'+currentLat+','+currentLon+',14z">餐饮搜索</a></p>'+
  '<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/transport/@'+currentLat+','+currentLon+',14z">交通搜索</a></p>';
 document.getElementById('heritageLinks').innerHTML=
  '<p><a target="_blank" rel="noopener" href="https://whc.unesco.org/en/list/?search='+q+'">UNESCO 世界遗产查询</a></p>'+
  '<p><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+q+'+travel">YouTube 旅游视频</a></p>'+
  '<p><a target="_blank" rel="noopener" href="https://en.wikipedia.org/wiki/'+q+'">Wikipedia</a></p>';
 loadSummary(currentName);
}
async function loadSummary(name){
 const langCode=lang==='zh'?'zh':'en';
 try{
  const r=await fetch('https://'+langCode+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(name));
  const d=await r.json();currentSummary=d.extract||'';
  document.getElementById('overview').textContent=currentSummary||words[lang].err;
 }catch(e){document.getElementById('overview').textContent=words[lang].err;}
}
function speak(){
 const t=document.getElementById('overview').textContent;
 if(!t||!window.speechSynthesis)return;
 const u=new SpeechSynthesisUtterance(t);u.lang=lang==='zh'?'zh-CN':'en-US';speechSynthesis.cancel();speechSynthesis.speak(u);
}
document.getElementById('place').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});
setLang('zh');
</script>
</body>
</html>
